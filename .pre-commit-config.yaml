# Pre-commit security, lint, and regression hooks
# Install with: pre-commit install  (or `make install-hooks` for built-in git hook)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: security-static-scan
        name: Static Security & Secret Scan
        entry: python scripts/security_check.py
        language: system
        pass_filenames: false

      - id: security-unit-tests
        name: Security Regression Suite (pytest)
        entry: pytest tests/test_security.py -q
        language: system
        pass_filenames: false
