name: Security & Quality Gate (CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Lint, Security Audit & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg (for video asset tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]" pip-audit

      - name: Ruff format & lint (including flake8-bandit S security rules)
        run: |
          ruff format --check src/ scripts/ main.py ui_app.py app.py tests/
          ruff check src/ scripts/ main.py ui_app.py app.py tests/

      - name: Static security & secret leak scan
        run: python scripts/security_check.py

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit --desc --strict || true

      - name: Run full test suite (including security regression tests)
        run: pytest tests/ -v --cov=src --cov-report=term-missing
